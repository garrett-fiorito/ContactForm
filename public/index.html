
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="icons8-dev-32.png">
    <link rel="stylesheet" href="style.css">
    <script src="validation.js" defer></script>
</head>
<body>

    <main>
        <h1>Contact Form</h1>

        <form action="#" method="get" novalidate>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">
                    <p id="fname-error" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">
                    <p id="lname-error" class="field-error"></p>

                </div>

                <div class="form-group">
                    <label for="job">Job Title</label>
                    <input type="text" id="job" name="job">
                </div>

                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company">
                </div>

                <div class="form-group">
                    <label for="linkedin">LinkedIn URL</label>
                    <input type="url" id="linkedin" name="linkedin">
                    <p id="linkedin-error" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email">
                    <p id="email-error" class="field-error"></p>
                </div>

            </div>

            <div class="meeting-grid">

                <div class="form-group">
                    <label for="meeting">How did we meet?</label>
                    <select id="meeting" name="meeting">
                        <option value="">Please select</option>
                        <option value="school">School</option>
                        <option value="work">Work</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="event">Event</option>
                        <option value="other">Other</option>
                    </select>
                    <p id="meeting-error" class="field-error"></p>
                </div>

                <div class="form-group">
                    <label for="other">Other (please specify)</label>
                    <input type="text" id="other" name="other">
                </div>

            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="mailing" name="mailing">
                <label for="mailing">Please add me to your mailing list</label>
            </div>

            <fieldset>
                <legend>Choose an email format:</legend>

                <input type="radio" id="html" name="format" value="html" checked>
                <label for="html">HTML</label>

                <input type="radio" id="text" name="format" value="text">
                <label for="text">Text</label>
            </fieldset>

            <button type="submit">Submit</button>

        </form>
    </main>

</body>
</html>
